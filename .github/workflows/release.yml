name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for pre-release (e.g. v1.1.6-pre)'
        required: true
        default: 'v1.1.6-pre'

permissions:
  contents: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      raw_tag: ${{ steps.get_version.outputs.raw_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: get_version
        env:
          TAG_INPUT: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$TAG_INPUT" ]; then
            RAW_VER="$TAG_INPUT"
          elif [[ "$REF_NAME" == v* ]]; then
            RAW_VER="$REF_NAME"
          elif [ -f .version ] && [ -n "$(tr -d ' \n\r\t' < .version)" ]; then
            RAW_VER="$(tr -d ' \n\r\t' < .version)"
          else
            RAW_VER="0.0"
          fi

          CLEAN_VER="$(echo "$RAW_VER" | sed -E 's/^[vV]//' | sed -E 's/-pre.*//')"
          if [ -z "$CLEAN_VER" ]; then
            CLEAN_VER="0.0"
          fi

          echo "version=$CLEAN_VER" >> "$GITHUB_OUTPUT"
          echo "raw_tag=$RAW_VER" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $CLEAN_VER (tag: $RAW_VER)"

  build-linux:
    needs: determine-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            docker_image: ""
            platform: linux
          - runner: ubuntu-24.04-arm
            arch: aarch64
            docker_image: ""
            platform: linux
          - runner: ubuntu-24.04
            arch: i386
            docker_image: "i386/ubuntu:24.04"
            platform: linux
          - runner: ubuntu-24.04-arm
            arch: armv7a
            docker_image: "arm32v7/ubuntu:24.04"
            platform: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker for cross-compilation
        if: matrix.docker_image != ''
        run: |
          docker pull ${{ matrix.docker_image }}
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ${{ matrix.docker_image }} bash -c "
            apt-get update && apt-get install -y build-essential cmake g++ libcurl4-openssl-dev
            chmod +x build.sh
            ./build.sh --clean
          "
        shell: bash

      - name: Install dependencies
        if: matrix.docker_image == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake g++ libcurl4-openssl-dev

      - name: Build Ori
        if: matrix.docker_image == ''
        env:
          ORI_VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          chmod +x build.sh
          ./build.sh --clean

      - name: Prepare release asset
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          cp build/ori "dist/ori-${PLATFORM}-${ARCH}-v${VERSION}.bin"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ori-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  build-freebsd:
    needs: determine-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: freebsd
            arch: x86_64
            target: freebsd/amd64
          - platform: freebsd
            arch: aarch64
            target: freebsd/arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Build FreeBSD ${{ matrix.arch }}
        uses: cross-platform-actions/action@v0.23.0
        env:
          ORI_VERSION: ${{ needs.determine-version.outputs.version }}
        with:
          platform: ${{ matrix.target }}
          command: |
            pkg install -y cmake gmake curl
            chmod +x build.sh
            ./build.sh --clean

      - name: Prepare FreeBSD ${{ matrix.arch }} release asset
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          cp build/ori "dist/ori-${PLATFORM}-${ARCH}-v${VERSION}.bin"

      - name: Upload FreeBSD ${{ matrix.arch }} binary
        uses: actions/upload-artifact@v4
        with:
          name: ori-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/ori-${{ matrix.platform }}-${{ matrix.arch }}-v${{ needs.determine-version.outputs.version }}.bin
          if-no-files-found: warn

  release:
    needs:
      - determine-version
      - build-linux
      - build-freebsd
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: ori-*-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: ${{ needs.determine-version.outputs.raw_tag }}
          name: "Ori Pre-release v${{ needs.determine-version.outputs.version }}"
          files: dist/*
          draft: false
