name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for pre-release (e.g. v1.1.6-pre)'
        required: true
        default: 'v1.1.6-pre'

permissions:
  contents: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      raw_tag: ${{ steps.get_version.outputs.raw_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: get_version
        env:
          TAG_INPUT: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$TAG_INPUT" ]; then
            RAW_VER="$TAG_INPUT"
          elif [[ "$REF_NAME" == v* ]]; then
            RAW_VER="$REF_NAME"
          elif [ -f .version ] && [ -n "$(tr -d ' \n\r\t' < .version)" ]; then
            RAW_VER="$(tr -d ' \n\r\t' < .version)"
          else
            RAW_VER="0.0"
          fi

          CLEAN_VER="$(echo "$RAW_VER" | sed -E 's/^[vV]//' | sed -E 's/-pre.*//')"
          if [ -z "$CLEAN_VER" ]; then
            CLEAN_VER="0.0"
          fi

          echo "version=$CLEAN_VER" >> "$GITHUB_OUTPUT"
          echo "raw_tag=$RAW_VER" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $CLEAN_VER (tag: $RAW_VER)"

  build:
    needs: determine-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake g++ libcurl4-openssl-dev

      - name: Build Ori
        env:
          ORI_VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Prepare release asset
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          cp build/ori "dist/ori-linux-${ARCH}-v${VERSION}.bin"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ori-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs:
      - determine-version
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: ori-linux-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: ${{ needs.determine-version.outputs.raw_tag }}
          name: "Ori Pre-release v${{ needs.determine-version.outputs.version }}"
          files: dist/*
          draft: false
